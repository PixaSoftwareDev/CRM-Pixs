name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint + format check
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Sin paso de migraciones: el schema Drizzle se sincroniza con `db:push`
      # (SQLite), no hay carpeta de migraciones que validar.
