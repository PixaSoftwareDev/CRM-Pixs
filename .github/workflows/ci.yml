name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint + format check
        run: npm run lint

      - name: Unit tests
        run: npm test

      # Chequeo de que las migraciones están al día con el schema (§8 del plan).
      # No aplica nada: solo falla si hay drift sin generar.
      - name: Migrations up to date
        run: npx drizzle-kit check
