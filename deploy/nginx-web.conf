# Front del CRM (SPA) bajo /crm. El nginx de borde (ia_nginx) le pasa
# /crm/* y manda /crm/api/* directo a la API.
server {
    listen 3020;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /crm { return 301 /crm/; }

    # Archivos con hash en el nombre: se cachean para siempre.
    location /crm/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cualquier ruta de la app devuelve index.html (sin caché, así un deploy se ve al toque).
    location /crm/ {
        add_header Cache-Control "no-cache";
        try_files $uri /crm/index.html;
    }

    location / { return 404; }
}
