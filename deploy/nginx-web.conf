# Front del CRM (SPA) bajo /crmpixs. El nginx de borde (ia_nginx) le pasa
# /crmpixs/* y manda /crmpixs/api/* directo a la API.
server {
    listen 3020;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /crmpixs { return 301 /crmpixs/; }

    # Archivos con hash en el nombre: se cachean para siempre.
    location /crmpixs/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Cualquier ruta de la app devuelve index.html (sin caché, así un deploy se ve al toque).
    location /crmpixs/ {
        add_header Cache-Control "no-cache";
        try_files $uri /crmpixs/index.html;
    }

    location / { return 404; }
}
