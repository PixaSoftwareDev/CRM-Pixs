# Producción en el VPS (/opt/crm). El nginx compartido (ia_nginx, configurado en
# el repo de Mutualyf) publica /crmpixs → crm-pixs-web:3020 y /crmpixs/api →
# crm-pixs-api:3005: por eso los contenedores llevan esos alias en la red edge.
name: crm

services:
  db:
    image: postgres:16-alpine
    container_name: crm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_DB: crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: { context: .., target: api }
    image: crm-api
    container_name: crm-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3005"
      DATABASE_URL: postgres://crm:${POSTGRES_PASSWORD}@crm-db:5432/crm
    depends_on:
      db: { condition: service_healthy }
    networks:
      internal: {}
      edge:
        aliases: [crm-pixs-api]

  web:
    build:
      context: ..
      target: web
      # Botón "Acceso de prueba": se activa con DEMO_LOGIN_* en .env (ver .env.example).
      args:
        VITE_DEMO_LOGIN_EMAIL: ${DEMO_LOGIN_EMAIL:-}
        VITE_DEMO_LOGIN_PASSWORD: ${DEMO_LOGIN_PASSWORD:-}
    image: crm-web
    container_name: crm-web
    restart: unless-stopped
    depends_on: [api]
    networks:
      edge:
        aliases: [crm-pixs-web]

volumes:
  pgdata:
    name: crm-pgdata

networks:
  internal: {}
  edge:
    external: true
